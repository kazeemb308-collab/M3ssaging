<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log In</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

    <main class="auth-container">

        <div class="logo-circle">
            💬
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Log in to continue messaging<br>
            your friends and family.
        </p>


        <form id="loginForm">

            <div class="input-box">

                <span>📞</span>

                <select id="loginCountryCode">
                    <option value="+234">+234</option>
                    <option value="+1">+1</option>
                    <option value="+44">+44</option>
                </select>

                <input
                    type="tel"
                    id="loginPhone"
                    placeholder="Phone Number"
                    required
                >

            </div>


            <div class="input-box">

                <span>🔒</span>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="toggleLoginPassword()"
                >
                    👁
                </button>

            </div>


            <div class="forgot-password">

                <a href="#" onclick="forgotPassword()">
                    Forgot password?
                </a>

            </div>


            <button
                type="submit"
                class="main-button"
            >
                Log In
            </button>

        </form>


        <div class="or-divider">
            <span>OR</span>
        </div>


        <button
            class="google-button"
            onclick="googleLogin()"
        >
            <span>G</span>
            Continue with Google
        </button>


        <p class="login-text">

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </p>


        <p class="terms">

            By continuing, you agree to our<br>

            <a href="#">
                Terms of Service
            </a>

            and

            <a href="#">
                Privacy Policy
            </a>

        </p>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
