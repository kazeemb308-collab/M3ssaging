<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body class="chat-page">


<div class="chat-app">


    <!-- CHAT HEADER -->

    <header class="chat-header">

        <button
            class="back-button"
            onclick="goBack()"
        >
            ←
        </button>


        <div class="chat-profile">

            <div class="small-avatar">
                👩🏾
            </div>

            <div>

                <h3>
                    Oluwatosin
                </h3>

                <p>
                    online
                </p>

            </div>

        </div>


        <div class="chat-actions">

            <button onclick="startVideoCall()">
                📹
            </button>

            <button onclick="startCall()">
                📞
            </button>

            <button>
                ⋮
            </button>

        </div>

    </header>


    <!-- MESSAGES -->

    <main
        class="messages"
        id="messages"
    >

        <div class="date-divider">
            <span>Today</span>
        </div>


        <!-- RECEIVED -->

        <div class="message received">

            <p>
                Hey! 👋
            </p>

            <span>
                9:40 AM
            </span>

        </div>


        <!-- SENT -->

        <div class="message sent">

            <p>
                Hi! 😊
            </p>

            <span>
                9:40 AM ✓✓
            </span>

        </div>


        <!-- RECEIVED -->

        <div class="message received">

            <p>
                How are you doing?
            </p>

            <span>
                9:40 AM
            </span>

        </div>


        <!-- SENT -->

        <div class="message sent">

            <p>
                I'm good, thanks! How about you?
            </p>

            <span>
                9:41 AM ✓✓
            </span>

        </div>


        <!-- RECEIVED -->

        <div class="message received">

            <p>
                I'm doing great! Just working on a project.
            </p>

            <span>
                9:41 AM
            </span>

        </div>


        <!-- SENT -->

        <div class="message sent">

            <p>
                That's awesome! Can't wait to see it.
            </p>

            <span>
                9:41 AM ✓✓
            </span>

        </div>


        <!-- RECEIVED -->

        <div class="message received">

            <p>
                I'll share it with you soon.
            </p>

            <span>
                9:41 AM
            </span>

        </div>

    </main>


    <!-- MESSAGE INPUT -->

    <footer class="message-footer">

        <div class="message-input-container">

            <button onclick="showEmoji()">
                😊
            </button>

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message"
                autocomplete="off"
                onkeydown="handleEnter(event)"
            >

            <button onclick="attachFile()">
                📎
            </button>

            <button onclick="openCamera()">
                📷
            </button>

        </div>


        <button
            class="mic-button"
            onclick="sendVoiceMessage()"
        >
            🎙️
        </button>

    </footer>


</div>


<script src="js/app.js"></script>

</body>
</html>
