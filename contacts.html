<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="phone-app">

    <header class="app-header">
        <h1>Contacts</h1>

        <div class="header-actions">
            <button onclick="searchContacts()">🔍</button>
            <button onclick="openMenu()">⋮</button>
        </div>
    </header>


    <main class="contacts-list">

        <div class="contact-action" onclick="newChat()">
            <div class="action-icon">💬</div>

            <div>
                <h3>New Chat</h3>
                <p>Start a conversation</p>
            </div>
        </div>


        <div class="contact-action" onclick="createGroup()">
            <div class="action-icon">👥</div>

            <div>
                <h3>New Group</h3>
                <p>Create a group conversation</p>
            </div>
        </div>


        <h4 class="section-title">
            Contacts
        </h4>


        <div class="contact-item" onclick="openChat('Oluwatosin')">

            <div class="avatar">
                👩🏾
            </div>

            <div class="contact-details">
                <h3>Oluwatosin</h3>
                <p>Hey there! I am using this app.</p>
            </div>

        </div>


        <div class="contact-item" onclick="openChat('Abdullahi')">

            <div class="avatar">
                👨🏾
            </div>

            <div class="contact-details">
                <h3>Abdullahi</h3>
                <p>Available</p>
            </div>

        </div>


        <div class="contact-item" onclick="openChat('Jane')">

            <div class="avatar">
                👩🏾
            </div>

            <div class="contact-details">
                <h3>Jane</h3>
                <p>At work</p>
            </div>

        </div>


        <div class="contact-item" onclick="openChat('Michael')">

            <div class="avatar">
                👨🏾
            </div>

            <div class="contact-details">
                <h3>Michael</h3>
                <p>Available</p>
            </div>

        </div>


        <div class="contact-item" onclick="openChat('David')">

            <div class="avatar">
                👨🏽
            </div>

            <div class="contact-details">
                <h3>David</h3>
                <p>Busy</p>
            </div>

        </div>

    </main>


    <nav class="bottom-nav">

        <button class="nav-item" onclick="goTo('chats.html')">
            <span>💬</span>
            <small>Chats</small>
        </button>

        <button class="nav-item" onclick="goTo('calls.html')">
            <span>📞</span>
            <small>Calls</small>
        </button>

        <button class="nav-item" onclick="goTo('status.html')">
            <span>◉</span>
            <small>Status</small>
        </button>

        <button class="nav-item active">
            <span>👤</span>
            <small>Contacts</small>
        </button>

    </nav>

</div>

<script src="js/app.js"></script>

</body>
</html>
