<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Status</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="phone-app">


    <header class="app-header">

        <h1>Status</h1>

        <div class="header-actions">

            <button onclick="openCamera()">
                📷
            </button>

            <button onclick="openMenu()">
                ⋮
            </button>

        </div>

    </header>


    <main class="status-list">


        <!-- MY STATUS -->

        <div class="my-status">

            <div class="status-avatar">

                <span>👤</span>

                <button
                    class="add-status"
                    onclick="addStatus()"
                >
                    +
                </button>

            </div>


            <div class="status-details">

                <h3>
                    My Status
                </h3>

                <p>
                    Tap to add status update
                </p>

            </div>

        </div>


        <h4 class="section-title">
            Recent updates
        </h4>


        <!-- STATUS 1 -->

        <div
            class="status-item"
            onclick="viewStatus('Oluwatosin')"
        >

            <div class="status-ring">

                <div class="status-avatar">
                    👩🏾
                </div>

            </div>


            <div class="status-details">

                <h3>
                    Oluwatosin
                </h3>

                <p>
                    Today, 9:35 AM
                </p>

            </div>

        </div>


        <!-- STATUS 2 -->

        <div
            class="status-item"
            onclick="viewStatus('Jane')"
        >

            <div class="status-ring">

                <div class="status-avatar">
                    👩🏾
                </div>

            </div>


            <div class="status-details">

                <h3>
                    Jane
                </h3>

                <p>
                    Today, 8:20 AM
                </p>

            </div>

        </div>


        <!-- STATUS 3 -->

        <div
            class="status-item"
            onclick="viewStatus('Michael')"
        >

            <div class="status-ring">

                <div class="status-avatar">
                    👨🏾
                </div>

            </div>


            <div class="status-details">

                <h3>
                    Michael
                </h3>

                <p>
                    Yesterday, 7:42 PM
                </p>

            </div>

        </div>


        <h4 class="section-title">
            Viewed updates
        </h4>


        <div class="status-item viewed">

            <div class="status-avatar">
                👨🏽
            </div>

            <div class="status-details">

                <h3>
                    David
                </h3>

                <p>
                    Yesterday, 5:10 PM
                </p>

            </div>

        </div>


    </main>


    <nav class="bottom-nav">

        <button
            class="nav-item"
            onclick="goTo('chats.html')"
        >

            <span>💬</span>
            <small>Chats</small>

        </button>


        <button
            class="nav-item"
            onclick="goTo('calls.html')"
        >

            <span>📞</span>
            <small>Calls</small>

        </button>


        <button class="nav-item active">

            <span>◉</span>
            <small>Status</small>

        </button>


        <button
            class="nav-item"
            onclick="goTo('contacts.html')"
        >

            <span>👤</span>
            <small>Contacts</small>

        </button>

    </nav>

</div>


<script src="js/app.js"></script>

</body>

</html>
