<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Profile</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="phone-app">


    <header class="simple-header">

        <button onclick="goBack()">
            ←
        </button>

        <h2>
            Edit Profile
        </h2>

        <button onclick="saveProfile()">
            ✓
        </button>

    </header>


    <main class="edit-profile-page">


        <!-- PROFILE PHOTO -->

        <div class="edit-photo-container">

            <div
                class="edit-profile-photo"
                id="editProfilePhoto"
            >
                👤
            </div>

            <button
                class="edit-photo-button"
                onclick="changeProfilePhoto()"
            >
                📷
            </button>

        </div>


        <p class="change-photo-text">
            Change profile photo
        </p>


        <!-- NAME -->

        <div class="edit-input-group">

            <label>
                Name
            </label>

            <div class="edit-input">

                <span>👤</span>

                <input
                    type="text"
                    id="editName"
                    placeholder="Your name"
                    maxlength="50"
                >

            </div>

        </div>


        <!-- ABOUT -->

        <div class="edit-input-group">

            <label>
                About
            </label>

            <div class="edit-input">

                <span>💬</span>

                <input
                    type="text"
                    id="editAbout"
                    placeholder="About you"
                    maxlength="100"
                >

            </div>

        </div>


        <!-- PHONE -->

        <div class="edit-input-group">

            <label>
                Phone Number
            </label>

            <div class="edit-input disabled-input">

                <span>📞</span>

                <input
                    type="tel"
                    value="+234 800 000 0000"
                    disabled
                >

            </div>

            <p class="input-note">
                Your phone number cannot be changed here.
            </p>

        </div>


        <button
            class="save-profile-button"
            onclick="saveProfile()"
        >
            Save Changes
        </button>


    </main>

</div>


<script src="js/app.js"></script>

<script>

    /*
     * Load saved profile information
     */

    const savedName =
        localStorage.getItem("userName");

    if (savedName) {

        document.getElementById("editName").value =
            savedName;

    }


</script>

</body>

</html>
